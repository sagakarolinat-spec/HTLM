    <main class="contact-page-content">
      <h1>Skriv till U.U</h1> <!-- Huvudrubrik för kontaktsidan -->
      <p>Har du frågor eller idéer? Vi tar gärna emot dina tankar, förslag eller åsikter.</p> <!-- Kort beskrivning av syftet med kontaktsidan -->
   <!-- Kontaktformuläret är en prototyp -->
    
      <form class="contact-form" onsubmit="return false" aria-describedby="contact-prototype-note"> <!-- Kontaktformulär, prototyp (skickar inga meddelanden ännu) -->
        <label for="contact-name">Ditt namn: (eller hitte-på-signatur)</label>
        <input id="contact-name" name="namn" type="text" autocomplete="name" required> 

        <label for="contact-email">Din e-postadress:</label> <!-- for="contact-email" kopplar etiketten till fältets id="contact-email". Då kan besökaren klicka på texten ”Din e-postadress” för att markera fältet. type="email" anger att fältet tar emot en e-postadress, och required betyder att det måste fyllas i.-->
        <input id="contact-email" name="epost" type="email" autocomplete="email" required>

        <label for="contact-message">Ditt meddelande:</label> <!-- for="contact-message" kopplar etiketten till fältets id="contact-message". Då kan besökaren klicka på texten ”Ditt meddelande” för att markera fältet. required betyder att fältet måste fyllas i. -->
        <textarea id="contact-message" name="meddelande" rows="6" required></textarea> <!-- Textarea för meddelandet, med 6 rader och obligatoriskt fält -->

        <button type="submit">Skicka meddelande</button>
        <p id="contact-result" role="status" aria-live="polite"></p>
      </form>
    </main>
