<!DOCTYPE html> <!-- Deklarerar dokumenttypen som HTML5 -->
<html lang="sv"> <!-- Språket på sidan är svenska -->
  <head> <!-- Huvudsektionen för metadata (information om dokumentet) -->
    <!-- Anger teckenkodningen så att svenska tecken visas korrekt (å, ä, ö). -->
    <meta charset="utf-8">
    <!-- Sidans namn visas i webbläsarfliken. -->
    <title>Unga.Universum</title>
    <!-- Ikonen visas bland annat i webbläsarens flik. -->
    <link rel="shortcut icon" href="./BILDER/favicon.ico" type="image/x-icon">
    <!-- Anpassar sidans visningsyta till enhetens bredd för responsiv layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Laddar webbplatsens gemensamma, minifierade CSS-regler. -->
    <link rel="stylesheet" href="./Style.min.css">
    <!-- Prioriterar bakgrundsbilden eftersom den syns direkt på startsidan. -->
    <link rel="preload" as="image" href="./bakgrund.webp" fetchpriority="high">
    <!-- defer väntar med att köra skripten tills HTML-dokumentet har parsats. -->
    <!-- Hanterar startsidans val av bakgrundsfärg. -->
    <script src="./background-color.js" defer></script>
    <!-- Skapar och hanterar den responsiva mobilmenyn. Den gör det möjligt att visa och dölja menyn på mindre skärmar, vilket jag fick som rekommendation under designkritiktillfället 20/11. -->
    <script src="./navigation.js" defer></script>
  </head>
  <body class="home-page">
    <!-- Klassen kopplar startsidan till dess särskilda CSS-regler. -->
    <!-- Dekorativa SVG-illustrationer som jag har gjort i Adobe Illustrator döljs för hjälpmedel eftersom de inte tillför innehåll. -->
    <div class="decorative-background" aria-hidden="true">
      <!-- Bildmåtten reserverar plats och hjälper till att minska layoutförskjutningar. -->
      <!-- Alt-beskrivningar:
        Jag var osäker på om dekorativa bilder behöver alternativtext. DIGG rekommenderar att bilder som inte tillför information döljs för hjälpmedel. Kurslitteraturen tar också upp att alt-text kan lämnas tom när en beskrivning blir meningslös eller klumpig. Men från mina anteckningar under dagens check in har jag skrivit att alla bilder måste ha alt-beskrrivning. Lade till det.
        Källor: DIGG, https://www.digg.se/webbriktlinjer/alla-webbriktlinjer/beskriv-med-text-allt-innehall-som-inte-ar-text
        Niederst Robbins, J. (2025). Learning Web Design, 6:e uppl., kapitel 7, "Adding Image".
        Dekorationsgruppen döljs här med aria-hidden="true".-->
      <!-- Dekorativ stjärna som placeras med CSS. -->
      <img
        class="star"
        src="./SVG/SVG/stjarna.svg"
        alt="dekoration i form av en stjärna"
        width="100"
        height="87"
      >
      <!-- Dekorativ klotterillustration. -->
      <img
        class="klotter"
        src="./SVG/SVG/Resurs 3.svg"
        alt="dekoration i form av klotter"
        width="100"
        height="87"
      >
      <!-- Dekorativ planetillustration. -->
      <img
        class="planet"
        src="./SVG/SVG/Resurs 2.svg"
        alt="dekoration i form av planet"
        width="100"
        height="87"
      >
      <!-- Dekorativ illustration av ungdomar (lineart). -->
      <img
        class="ungdomar"
        src="./SVG/SVG/UNGDOMAR.svg"
        alt="dekoration i form av ungdomar(lineart)"
        width="100"
        height="87"
      >
      <!-- Dekorativ illustration av en lunga med blommor. -->
      <img
        class="lungblomma"
        src="./SVG/SVG/lungblomma.svg"
        alt="dekoration i form av en lunga med blommor"
        width="100"
        height="87"
      >
    </div> <!-- Slut på dekorativ bakgrund -->

    <!-- Kategorilänkarna bildar sidans navigation; navigation.js lägger till mobilmenyn. -->
    <nav class="category-nav"> <!-- Navigation för kategorilänkar samt klassificering av innehåll -->
      <!-- En lista grupperar webbplatsens huvudsakliga kategorier. -->
      <ul> <!-- Unordered list, alltså en punktlista utan numrering. -->
        <li> <!-- List Item, alltså ett listelement.-->
          <!-- Länk till artikelsamlingen med tillhörande ikon. -->
          <a href="artiklar.html">Artiklar<br><img class="articles-icon" src="./BILDER/artiklar.png" alt="artikelikon" width="286" height="180"></a>
        </li> <!-- Slut på artiklar-länk -->
        <li>
          <!-- Länk till podcastinnehållet med tillhörande ikon. -->
          <a href="Podcast.html">Podcast<br><img class="podcast-icon" src="./BILDER/PODD.png" alt="podcastikon" width="306" height="275"></a>
        </li>
        <li>
          <!-- Länk till webb-tv med tillhörande ikon. -->
          <a href="WEBB-TV.html">WEBB-TV<br><img class="webtv-icon" src="./BILDER/Webbtv.ben.png" alt="webbtvikon" width="250" height="200"></a>
        </li>
        <li>
          <!-- Länk till spel och quiz med tillhörande ikon. -->
          <a href="Spel och Quiz.html">Spel och Quiz<br><img class="games-icon" src="./BILDER/SPEL.png" alt="spelikon" width="301" height="172"></a>
        </li>
        <li>
          <!-- Länk till information om webbplatsen. -->
          <a href="OM UNGA.UNIVERSUM.html">Om U.U<br><img class="about-icon" src="./BILDER/Om oss.png" alt="om oss ikon" width="213" height="213"></a>
        </li>
        <li>
          <!-- Länk till kontaktformuläret. -->
          <a href="skrivtillUU.html">Skriv till U.U<br><img class="contact-icon" src="./SVG/brev.svg" alt="kontaktikon" width="163" height="119"></a>
        </li>
      </ul>
      <!-- history.back() återgår till föregående sida i webbläsarhistoriken. -->
      <button class="back-button" type="button" onclick="history.back()" aria-label="Go back">
        <img src="Symboler/pil%201.png" alt="pil för bakåtknapp" width="230" height="166">
      </button>
    </nav>

    <!-- Huvudinnehåll: välkomsttext och interaktiv logotyp. -->
    <main class="welcome-block">
      <!-- Startsidan har en h1 som anger sidans huvudsakliga ämne. -->
      <h1 class="welcome-title">Hej! Välkommen till</h1>
      <!-- SVG-textlogotypen kompletterar välkomsttexten. -->
      <img id="logonamn" src="./SVG/NAMNLOGO.svg" alt="Unga.Universum" width="671" height="77">
      <!-- Knappen gör logotypen klickbar och startar dess animation via Script.js. -->
      <button class="home-logo" type="button" aria-label="Snurra logotypen">
        <picture class="site-logo-picture">
          <!-- WebP-varianterna anpassas efter visningsbredd; PNG-bilden är reservformat. -->
          <source
            type="image/webp"
            srcset="./logo-unga-universum-144.webp 144w, ./logo-unga-universum-160.webp 160w, ./logo-unga-universum-220.webp 220w, ./logo-unga-universum-320.webp 320w, ./logo-unga-universum-640.webp 640w"
            sizes="(max-width: 640px) 160px, (max-width: 1280px) 25vw, 320px"
          >
          <!-- Bredd och höjd reserverar bildens plats innan den har laddats. -->
          <img class="site-logo" src="logo-unga-universum.png" alt="Logotyp för Unga.Universum" width="826" height="768">
        </picture> <!-- Slut på logotypbilden -->
      </button> <!-- Slut på klickbar logotyp -->
    </main> <!-- Slut på huvudinnehåll -->
    <!-- Kontaktuppgifter och länk till webbplatsens Instagram-konto. -->
    <footer class="footer">
      <p> <!-- Paragraf, start på kontaktinformation -->
        <!-- mailto-länken öppnar besökarens e-postprogram med adressen ifylld. -->
        <a href="mailto:kontakt@ungauniversum.se"><img class="footer-mail-icon" src="./SVG/POSTBREV-icon.png" alt="e-postikon" width="96" height="54">Mejla oss på Unga.Universum.se</a>
      </p> <!-- Slut på kontaktinformation -->
      <!-- Ansvarig utgivare och upphovsrättsinformation. -->
      <p>Ansvarig utgivare: Saga Lindholm © 2026.</p>
      <!-- Länk till webbplatsens Instagram-profil. Nedanför är länk till instagram, via <a-element som omsluter min instagramijon och länkar till profilen med sitt href-attribut.-->
      <a
        class="instagram-link"
        href="https://www.instagram.com/ungauniversum?utm_source=qr"
        aria-label="Besök vår Instagram"
      >
      <!-- Instagramikon och länk -->
        <img src="./SVG/insta.svg" alt="Instagramikon" width="100" height="100">
        <div id="insta"></div>
      </a>
    </footer> <!-- Slut på sidfot -->
     <!-- Script.js hanterar logotypens animation och andra sidors interaktiva funktioner. -->
    <script src="./Script.js" defer></script>
  </body> <!-- Slut på dokumentets kropp -->
</html> <!-- Slut på HTML-dokument -->
